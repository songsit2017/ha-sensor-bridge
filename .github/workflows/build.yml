name: Build and release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      HAVE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.HAVE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=hasensorbridge" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ha-sensor-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ha-sensor-bridge
          path: ha-sensor-bridge.apk

      # Publish only when signed with the real key: an APK signed with a throwaway debug
      # key could never be installed over the previous release.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAVE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HA Sensor Bridge 0.1.${{ github.run_number }}
          body: Build ${{ github.run_number }} from ${{ github.sha }}
          files: ha-sensor-bridge.apk
          make_latest: true
